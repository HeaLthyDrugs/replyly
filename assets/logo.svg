<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rlyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="rlyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#5B21B6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Centered Diamond Logo with Rly Text -->
  <g transform="translate(256, 256)">
    <!-- Rotated rounded rectangle forming the squircle diamond -->
    <rect
      x="-170"
      y="-170"
      width="340"
      height="340"
      rx="85"
      transform="rotate(45)"
      fill="url(#rlyGradient)"
      filter="url(#rlyShadow)"
    />
    
    <!-- Inner Accent Highlight -->
    <rect
      x="-162"
      y="-162"
      width="324"
      height="324"
      rx="80"
      transform="rotate(45)"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.15"
      stroke-width="4"
    />

    <!-- Text "Rly" -->
    <text
      x="0"
      y="38"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
      font-size="124"
      font-weight="900"
      letter-spacing="-2px"
    >Rly</text>
  </g>
</svg>